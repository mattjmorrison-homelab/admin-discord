name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    # OIDC (todo #17): this job authenticates to OpenBao via GitHub's own
    # OIDC token instead of the Kubernetes-auth JWT the apply job still
    # uses -- id-token: write is what lets this job request one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      # OIDC (todo #17): fetches AWS state creds + the Discord bot token
      # via GitHub OIDC + OpenBao's jwt auth method. Two logins, same as
      # the two Kubernetes-auth logins this replaces (one per policy) --
      # same GitHub OIDC token reused for both, only the `role` param
      # differs per login.
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          vault_login() {
            curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
              -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" --arg role "$1" '{jwt: $jwt, role: $role}')" \
              | jq -r '.auth.client_token'
          }
          fetch_secret() {
            curl -sf -H "X-Vault-Token: $1" "$VAULT_ADDR/v1/kv/data/$2" | jq -r '.data.data.value'
          }

          TOFU_STATE_TOKEN=$(vault_login admin-discord-tofu-state-oidc)
          ACCESS_KEY_ID=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-discord/tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-discord/tofu-state-secret-access-key)

          BOT_TOKEN=$(vault_login admin-discord-oidc)
          DISCORD_TOKEN=$(fetch_secret "$BOT_TOKEN" homelab/admin-discord/discord-bot-token)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "::add-mask::$DISCORD_TOKEN"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "DISCORD_TOKEN=$DISCORD_TOKEN" >> "$GITHUB_ENV"
      - run: tofu init
      - run: tofu plan -out=tfplan
      - uses: mattjmorrison-homelab/actions-bash@6183880188049f6e03f086d403c9db38f8089c40 # main
      - run: shellcheck scripts/*.sh
      - run: bats test/
      # Catches exactly the gap that caused the pi-health webhook bug
      # (a new consumer added to locals.tf with no matching OpenBao
      # write grant, nothing failing loudly) before merge instead of
      # after. Needs the plan's computed outputs (webhook_openbao_paths
      # is pure config, not a resource attribute, so it's fully known at
      # plan time even for a brand-new output not yet in remote state) --
      # placed after `tofu plan` rather than immediately after the OIDC
      # credential-fetch step above for that reason, logging in via its
      # own fresh GitHub OIDC token rather than reusing one from that
      # earlier step.
      - name: Verify OpenBao write grants exist for every webhook path
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          WEBHOOKS_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
            -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" '{jwt: $jwt, role: "admin-discord-webhooks-oidc"}')" \
            | jq -r '.auth.client_token')
          echo "::add-mask::$WEBHOOKS_TOKEN"
          export WEBHOOKS_TOKEN

          tofu show -json tfplan \
            | jq '.planned_values.outputs.webhook_openbao_paths.value' \
            > /tmp/webhook_openbao_paths.json

          scripts/validate-webhook-grants.sh /tmp/webhook_openbao_paths.json
      - uses: mattjmorrison-homelab/actions-tofu/upload-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-discord-tofu-state

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: k8s-amd64
    # OIDC (todo #17): same roles/mechanism proven in the check job -- one
    # role per policy, reused across every job in this repo, since the
    # bound_claims only distinguish "which repo", not "which job".
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')
          echo "GH_OIDC_TOKEN=$GH_OIDC_TOKEN" >> "$GITHUB_ENV"

          vault_login() {
            curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
              -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" --arg role "$1" '{jwt: $jwt, role: $role}')" \
              | jq -r '.auth.client_token'
          }
          fetch_secret() {
            curl -sf -H "X-Vault-Token: $1" "$VAULT_ADDR/v1/kv/data/$2" | jq -r '.data.data.value'
          }

          TOFU_STATE_TOKEN=$(vault_login admin-discord-tofu-state-oidc)
          ACCESS_KEY_ID=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-discord/tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-discord/tofu-state-secret-access-key)

          BOT_TOKEN=$(vault_login admin-discord-oidc)
          DISCORD_TOKEN=$(fetch_secret "$BOT_TOKEN" homelab/admin-discord/discord-bot-token)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "::add-mask::$DISCORD_TOKEN"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "DISCORD_TOKEN=$DISCORD_TOKEN" >> "$GITHUB_ENV"
      - uses: mattjmorrison-homelab/actions-tofu/download-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-discord-tofu-state
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan

      # Pushes each consumer's own dedicated webhook URL into its own
      # OpenBao path, right after creating/confirming it -- this repo
      # owns the value, so it's the only thing that ever writes it.
      # Consumers only ever read from OpenBao now, never this repo's
      # Terraform state directly (replaces the old read-output
      # mechanism ui-hdmi-switch/graph-hdmi-switch used to use).
      #
      # OIDC (todo #17): reuses the GH_OIDC_TOKEN fetched above, logging
      # in via the separate, write-only admin-discord-webhooks-oidc role
      # -- kept as its own login rather than folded into the read login
      # above, same narrow-write-scope shape the Kubernetes-auth version
      # had (a distinct role just for this write).
      - name: Log in for webhook writes
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          WEBHOOKS_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
            -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" '{jwt: $jwt, role: "admin-discord-webhooks-oidc"}')" \
            | jq -r '.auth.client_token')
          echo "::add-mask::$WEBHOOKS_TOKEN"
          echo "WEBHOOKS_TOKEN=$WEBHOOKS_TOKEN" >> "$GITHUB_ENV"
      # Data-driven: loops over every entry in locals.tf's webhooks map
      # (via webhook_urls + webhook_openbao_paths) instead of one
      # hand-written step-pair per consumer -- adding a new webhook to
      # locals.tf is enough, no new CI step required here. Same request
      # shape as the named steps this replaces (same path construction,
      # same {data: {value: ...}} body), just looped instead of repeated.
      - name: Write every webhook URL into its OpenBao path
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          tofu output -json webhook_urls > /tmp/webhook_urls.json
          tofu output -json webhook_openbao_paths > /tmp/webhook_openbao_paths.json
          scripts/write-webhook-secrets.sh /tmp/webhook_urls.json /tmp/webhook_openbao_paths.json
